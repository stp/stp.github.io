name: Publish redirects

# This repo no longer holds the website. It exists because GitHub reserves the
# name stp.github.io for the organisation's Pages URL, which cannot be served
# from any other repo -- so the old address lives on here as redirect stubs
# pointing at https://stp.github.io/stp/, built and published from stp/stp.
#
# The files are plain HTML with no Jekyll processing, so this workflow just
# uploads them verbatim.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # .nojekyll is not strictly needed for these files, but it keeps the
      # upload honest if a future stub ever uses an underscore-prefixed path.
      - run: |
          mkdir -p _site
          cp -r index.html docs live _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
